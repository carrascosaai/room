# Compila la app Android de Taimo (APK para instalar a mano y probar en un móvil
# real). Se ejecuta sola al subir cambios de taimo/ a la rama de Taimo, o a mano:
# Actions → «Taimo → APK Android» → Run workflow. El APK sale en «Artifacts».
# Va firmado con la clave de pruebas: sirve para probar, no para Google Play.
name: Taimo → APK Android

on:
  workflow_dispatch:
  push:
    branches: [claude/taimo-design-68o8w0]
    paths:
      - 'taimo/**'
      - '.github/workflows/taimo-android.yml'

permissions:
  contents: read

concurrency:
  group: taimo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: taimo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taimo/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: taimo/android
        # Solo arm64 (todos los Android de los últimos ~8 años): el APK pesa la mitad
        # y se pasa mejor por WhatsApp.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        env:
          # Versión que se ve en «Danos tu opinión», para saber qué APK tiene cada probador.
          EXPO_PUBLIC_BUILD: ${{ github.run_number }}-${{ github.sha }}
      - name: Comprobar el lector de avisos en el APK
        # Si el servicio no está en el manifiesto final, Taimo no sale en «Acceso a notificaciones».
        run: |
          manifest=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml | xargs grep -l 'TaimoNotificationListener' | head -1)
          test -n "$manifest" || { echo "::error::Falta TaimoNotificationListener en el manifiesto"; exit 1; }
          echo "Manifiesto: $manifest"
          grep -n -B2 -A8 'TaimoNotificationListener' "$manifest"
          grep -n 'targetSdkVersion\|minSdkVersion' "$manifest" || true
      - name: Nombre del APK
        run: mkdir -p dist && mv android/app/build/outputs/apk/release/app-release.apk "dist/taimo-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: taimo-android-apk
          path: taimo/dist/*.apk
          retention-days: 30
      # Copia solo para la prueba: el emulador de GitHub es x86_64 y el APK de
      # los móviles (arm64) no arranca ahí. Mismo código, otra arquitectura.
      - name: Compilar APK de prueba (x86_64)
        working-directory: taimo/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
        env:
          EXPO_PUBLIC_BUILD: ${{ github.run_number }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: taimo-android-apk-emulador
          path: taimo/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  # Prueba de punta a punta en un móvil Android virtual (Android 14): instala el
  # APK, simula avisos de pago y comprueba que se apuntan y que nada se cierra.
  e2e:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taimo-android-apk-emulador
          path: apk
      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash taimo/scripts/android-e2e.sh "$(ls apk/*.apk | head -1)" e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taimo-android-e2e
          path: e2e-out
          retention-days: 14
