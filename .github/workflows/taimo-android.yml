# Compila la app Android de Taimo (APK para instalar a mano y probar en un móvil
# real). Se ejecuta sola al subir cambios de taimo/ a la rama de Taimo, o a mano:
# Actions → «Taimo → APK Android» → Run workflow. El APK sale en «Artifacts».
# Va firmado con la clave de pruebas: sirve para probar, no para Google Play.
name: Taimo → APK Android

on:
  workflow_dispatch:
  push:
    branches: [claude/taimo-design-68o8w0]
    paths:
      - 'taimo/**'
      - '.github/workflows/taimo-android.yml'

permissions:
  contents: read

concurrency:
  group: taimo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: taimo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taimo/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: taimo/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: taimo-android-apk
          path: taimo/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
