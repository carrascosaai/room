# Publica la app craic/ en GitHub Pages.
# Requisito (una vez): Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Craic → GitHub Pages

on:
  push:
    branches: [main]
    paths: ["craic/**", ".github/workflows/craic-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: craic/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # La web se sirve en https://<usuario>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: craic/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
