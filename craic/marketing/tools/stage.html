<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="flags.js"></script><style>
@font-face{font-family:R;font-weight:900;src:url(rubik-latin-900-normal.woff2)}
@font-face{font-family:R;font-weight:700;src:url(rubik-latin-700-normal.woff2)}
@font-face{font-family:R;font-weight:500;src:url(rubik-latin-500-normal.woff2)}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:R,sans-serif;background:#f7f4ee;position:relative;color:#121212}
.glow{position:absolute;inset:0;background:radial-gradient(700px 600px at 0% 0%,rgb(196 214 244/.9),transparent),radial-gradient(800px 700px at 100% 100%,rgb(246 205 200/.85),transparent)}
.brand{position:absolute;top:70px;left:0;right:0;text-align:center;font-weight:900;font-size:44px;letter-spacing:2px;opacity:.9}
.cap{position:absolute;top:130px;left:60px;right:60px;height:300px;display:flex;align-items:center;justify-content:center;text-align:center}
.cap span{font-weight:900;font-size:76px;line-height:1.05;letter-spacing:-1px;transition:transform .18s ease,opacity .18s ease}
.cap span.pop{transform:scale(.9);opacity:0}
.cap em{font-style:normal;color:#1c8a55}
.cap b{color:#e5484d}
.phone{position:absolute;left:50%;top:440px;width:698px;height:1450px;transform:translateX(-50%);border-radius:78px;background:#111;padding:14px;box-shadow:0 40px 90px rgb(0 0 0/.28)}
.screen{width:670px;height:1422px;border-radius:64px;overflow:hidden;position:relative;background:#f7f4ee}
iframe{border:0;width:390px;height:828px;transform:scale(1.718);transform-origin:0 0}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:rgb(247 244 238/.0);opacity:0;pointer-events:none;transition:opacity .35s ease}
.end.on{opacity:1;background:rgb(247 244 238/.94)}
.end .logo{font-weight:900;font-size:150px;letter-spacing:4px}
.end .free{background:#1c8a55;color:#fff;font-weight:900;font-size:120px;padding:18px 70px;border-radius:999px;transform:rotate(-3deg);box-shadow:0 20px 50px rgb(28 138 85/.4)}
.end .sub{font-weight:700;font-size:48px;color:#4a4744;text-align:center;line-height:1.3}
.end .url{background:#1c1c1c;color:#fff;font-weight:700;font-size:62px;padding:26px 56px;border-radius:999px}
.end .flags{display:flex;gap:14px}
.tap{position:absolute;width:90px;height:90px;border-radius:50%;background:rgb(229 72 77/.35);border:6px solid rgb(229 72 77/.8);transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;z-index:5}
.tap.go{animation:tap .55s ease-out}
@keyframes tap{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
</style></head><body>
<div class="glow"></div>
<div class="brand">CRAIC</div>
<div class="cap"><span id="cap"></span></div>
<div class="phone"><div class="screen"><iframe id="app" src="/?video"></iframe><div class="tap" id="tap"></div></div></div>
<div class="end" id="end"><div class="logo">CRAIC</div><div class="free">GRATIS</div><div class="sub" id="endsub">Sin registro · Sin anuncios<br>Aprende inglés hablando</div><div class="flags" id="flags"></div><div class="url">craic.vercel.app</div></div>
<script>
document.getElementById("flags").innerHTML=["ie","gb","eng","sco","wal","us","au","nz","ca"].map(c=>flag(c,82)).join("");
window.setCap = (html) => { const el = document.getElementById("cap"); el.classList.add("pop"); setTimeout(()=>{ el.innerHTML = html; el.classList.remove("pop"); }, 90); };
window.showEnd = (sub) => { if (sub) document.getElementById("endsub").innerHTML = sub; document.getElementById("end").classList.add("on"); };
window.tapAt = (x, y) => { const t = document.getElementById("tap"); t.style.left = x*1.718+"px"; t.style.top = y*1.718+"px"; t.classList.remove("go"); void t.offsetWidth; t.classList.add("go"); };
</script></body></html>
